name: Build and Release WoW Addon

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Package Structure
        run: |
          mkdir -p RetRotation
          cp RetRotation.lua RetRotation/
          cp RetRotation.toc RetRotation/
          # Check if README exists and include it if so, but optional
          if [ -f README.md ]; then cp README.md RetRotation/; fi

      - name: Create Zip Archive
        run: |
          zip -r RetRotation.zip RetRotation

      - name: Read addon version from TOC
        id: version
        run: |
          VERSION=$(grep -m1 '^## Version:' RetRotation.toc | sed 's/^## Version:[[:space:]]*//')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read ## Version from RetRotation.toc"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: RetRotation.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
